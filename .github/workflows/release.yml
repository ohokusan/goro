name: Release

on:
  workflow_dispatch:
  push:
    branches: [feat/poring-cash-mount]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: goro-windows-x86_64.exe
          - goos: windows
            goarch: arm64
            name: goro-windows-arm64.exe
          - goos: darwin
            goarch: amd64
            name: goro-osx-x86_64
          - goos: darwin
            goarch: arm64
            name: goro-osx-arm64
          - goos: linux
            goarch: amd64
            name: goro-linux-x86_64
          - goos: linux
            goarch: arm64
            name: goro-linux-arm64
    env:
      CGO_ENABLED: "0"
      GOFLAGS: "-tags=nofakecgo"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        run: >-
          GOOS=linux GOARCH=amd64
          go run github.com/akavel/rsrc@936343600d578fb5da472acf6987ed76935a389b
          -arch ${{ matrix.goarch }}
          -ico packaging/windows/goro.ico
          -o rsrc_windows_${{ matrix.goarch }}.syso
      - run: |
          ldflags="-s -w"
          if [ "$GOOS" = "windows" ]; then
            ldflags="$ldflags -H=windowsgui"
          fi
          go build -trimpath -ldflags="$ldflags" -o dist/${{ matrix.name }} .
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.name }}

  android:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE: ${{ runner.temp }}/goro-release.keystore
          ANDROID_BUILD_TYPE: release
          ANDROID_VERSION_NAME: ${{ github.event.release.tag_name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set the ANDROID_KEYSTORE_PASSWORD repository secret}"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          packaging/android/build.sh
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/android/goro-android-arm64.apk
          fail_on_unmatched_files: true

  cash-mount-macos:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
      GOFLAGS: "-tags=nofakecgo"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Cash Mount support and related packages
        run: go test ./game ./world ./res ./network
      - name: Test converted ACT anchor repair
        run: python3 -m unittest discover -s tools -p test_fix_poring_mount_anchors.py -v
      - name: Compile macOS ARM64
        run: GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/goro-osx-arm64 .
      - uses: actions/upload-artifact@v7
        with:
          name: goro-macos-arm64-cash-mount
          path: dist/goro-osx-arm64
          if-no-files-found: error
